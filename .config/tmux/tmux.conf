# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Options
set-option -g allow-passthrough on                 # OSC passthrough (images, progress bars)
set-option -g set-clipboard on                     # OSC 52 copy to system clipboard
set-option -s extended-keys on                     # Shift+Enter / Ctrl+Enter in AI CLIs
set-option -as terminal-features 'xterm*:extkeys'  # Enable xterm features

# No rename the things!!!
set-option -g allow-rename off

# Keys mode
set-window-option -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection       # v to select in copy-mode
bind -T copy-mode-vi y send -X copy-pipe-and-cancel  # y to yank in copy-mode
bind -T copy-mode-vi Escape send -X cancel           # ESC to exit copy-mode
bind Enter copy-mode                                 # prefix+Enter to enter copy-mode

# Quikly reload the source
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# =============================== Panels ====================================
setw -g pane-base-index 1                           # Numeration of panes start at 1

unbind '"'
unbind %
bind - split-window -h -c "#{pane_current_path}"    # Vertical split
bind = split-window -v -c "#{pane_current_path}"    # Horizontal split

bind h select-pane -L                               # Select left pane
bind l select-pane -R                               # Select right pane
bind k select-pane -U                               # Select up pane
bind j select-pane -D                               # Select down pane

bind C-h resize-pane -L 4                           # Resize pane to left
bind C-l resize-pane -R 4                           # Resize pane to right
bind C-k resize-pane -U 2                           # Resize pane to up
bind C-j resize-pane -D 2                           # Resize pane to down

# =============================== Windows ====================================
set -g base-index 1                                 # Numeration of windows start at 1

bind -n C-Left select-window -t :-                  # Previus window
bind -n C-Right select-window -t :+                 # Next window

# =============================== Mouse ====================================
set -g mouse on

# Toggle mouse capture
bind m set -g mouse \; display "mouse #{?mouse,on,off}"

# Wheel enters copy-mode
bind -n WheelUpPane if -F -t= "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -Mt=" "if -Ft= '#{alternate_on}' 'send -t= Up Up Up' 'copy-mode -et='"

# =============================== Plugins ====================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin '2kabhishek/tmux2k'
set -g @plugin 'lloydbond/tmux-floating-terminal'

# Continuum ====================================
set -g @continuum-boot 'on'
run-shell '~/.config/tmux/plugins/tmux-continuum/continuum.tmux'

# tmux2k ====================================
set -g @tmux2k-left-plugins 'session cwd'
set -g @tmux2k-right-plugins 'git time'
set -g @tmux2k-window-list-alignment 'left'
set -g @tmux2k-theme 'gruvbox'

# floating-terminal ====================================
set -g @floating_scratch_term 'C-t'

# TPM ====================================
run '~/.config/tmux/plugins/tpm/tpm'    # keep this line at the very bottom of tmux.conf
