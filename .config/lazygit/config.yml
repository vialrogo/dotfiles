gui:
  nerdFontsVersion: "3"
  showIcons: true
  theme:
    activeBorderColor:
      - '#ff9e64'
      - bold
    inactiveBorderColor:
      - '#27a1b9'
    searchingActiveBorderColor:
      - '#ff9e64'
      - bold
    optionTextColor:
      - '#7aa2f7'
    selectedLineBgColor:
      - '#283457'
    cherryPickedCommitFgColor:
      - '#7aa2f7'
    cherryPickedCommitBgColor:
      - '#bb9af7'
    markedBaseCommitFgColor:
      - '#7aa2f7'
    markedBaseCommitBgColor:
      - '#e0af68'
    defaultFgColor:
      - '#c0caf5'
    branchColorPatterns:
      '^main(/|$)': red
      '^master(/|$)': red
git:
  paging:
    pager: --pagin=never
  diffRenderers:
    - colorArg: always
      command: diff-so-fancy
  commit:
    signOff: false
  log:
    order: author-date-order
    showGraph: when-maximised
    showWholeGraph: true
